<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>ÉGIDA · Capítulo 1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap">
<style>/* Layout: one 16:9 stage centred in a dark room; HUD hugs the corners, menus sit on the canvas. */
:root {
  color-scheme: dark;
  --bg: #04070a; --panel: rgba(6, 16, 20, 0.72); --line: #2c4850; --text: #dcefef; --muted: #86a2a8;
  --accent: #7fe8d8; --hp: #8ef0b4; --energy: #6cc6ff; --heat: #ffb347; --danger: #ff5a4a; --gold: #ffd59a;
  --display: "Chakra Petch", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: radial-gradient(ellipse at 50% 30%, #0b1418, var(--bg) 70%); color: var(--text); font-family: var(--display);
  display: grid; place-items: center; overflow: hidden; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
#stage { position: relative; aspect-ratio: 16 / 9; max-width: 100%; container-type: inline-size; border-radius: 6px; overflow: hidden;
  box-shadow: 0 0 0 1px #16262b, 0 24px 80px #000; background: #000; user-select: none; -webkit-user-select: none; touch-action: none; }
canvas#txt { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
canvas#game { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; font-size: clamp(8px, 1.5cqw, 13px); letter-spacing: 0.04em; display: none; }
#stage.playing #hud { display: block; }
.hud-tl { position: absolute; left: 2.2%; top: 3.2%; width: 23%; padding: 0.55em 0.7em 0.65em; background: linear-gradient(100deg, var(--panel), rgba(6, 16, 20, 0.25));
  border-left: 2px solid var(--accent); clip-path: polygon(0 0, 100% 0, 92% 100%, 0 100%); display: grid; gap: 0.36em; }
.suit { display: flex; justify-content: space-between; gap: 0.6em; font-weight: 700; font-size: 1.05em; }
.suit #hMode { color: var(--muted); font-weight: 600; font-size: 0.8em; align-self: center; }
.bar { position: relative; height: 0.62em; background: rgba(255, 255, 255, 0.08); }
.bar i { position: absolute; inset: 0 auto 0 0; transition: width 0.1s linear; }
.bar b { display: none; }
.bar.hp i { background: var(--hp); } .bar.ht i { background: linear-gradient(90deg, #6d7d84, var(--heat)); }
.bar.ht { height: 0.36em; }
.energy { display: flex; align-items: baseline; gap: 0.45em; line-height: 1; }
.energy strong { font-size: 2em; font-weight: 700; color: var(--energy); font-variant-numeric: tabular-nums; min-width: 2.2ch; text-shadow: 0 0 8px rgba(108, 198, 255, 0.35); }
.energy span { font-size: 0.72em; letter-spacing: 0.16em; color: var(--muted); font-weight: 700; }
.energy em { font-style: normal; font-size: 0.8em; font-weight: 700; margin-left: auto; }
.energy em.up { color: var(--hp); } .energy em.down { color: var(--muted); }
.energy.low strong { color: var(--danger); animation: blink 0.6s steps(2) infinite; }
.energy.hint { outline: 1px solid var(--accent); outline-offset: 3px; animation: blink 0.5s steps(2) 6; }
.eco .energy strong { color: var(--gold); }
.hud-compass { position: absolute; left: 50%; top: 1.4%; transform: translateX(-50%); width: 22%; text-align: center; opacity: 0.75; }
.hud-compass .tape { height: 0.55em; border-bottom: 1px solid rgba(127, 232, 216, 0.4); background-image: repeating-linear-gradient(90deg, rgba(127,232,216,0.5) 0 1px, transparent 1px 10px); }
.hud-compass span { display: block; font-size: 0.72em; color: var(--muted); margin-top: 0.2em; font-weight: 600; letter-spacing: 0.08em; }
.hud-tr { flex-direction: column; align-items: flex-end; }
.hud-tr .chips { display: flex; gap: 0.5em; }
.radar canvas { width: 6.4em; height: 4em; display: block; image-rendering: pixelated; background: rgba(6, 16, 20, 0.5); }
.hud-sys { position: absolute; right: 2.2%; bottom: 4%; display: grid; gap: 0.15em; font-size: 0.72em; opacity: 0.8; text-align: right; }
.hud-sys div { display: flex; gap: 0.8em; justify-content: flex-end; }
.hud-sys span { color: var(--muted); letter-spacing: 0.12em; } .hud-sys b { color: var(--text); min-width: 7.5em; }
.hud-combo { position: absolute; right: 22%; top: 30%; font-size: 1.8em; font-weight: 700; color: var(--gold); text-shadow: 0 2px 4px #000; transform: rotate(-6deg); }
.low-hp .bar.hp i { background: var(--danger); animation: blink 0.5s steps(2) infinite; }
.hot .bar.ht i { background: var(--danger); }
.eco .bar.en i { background: var(--gold); }
.hud-tr { position: absolute; right: 2.2%; top: 3.2%; display: flex; gap: 0.5em; }
.chip { display: flex; align-items: center; gap: 0.35em; padding: 0.3em 0.55em; background: var(--panel); border: 1px solid var(--line); border-radius: 3px; font-weight: 700; }
.chip svg { width: 1.5em; height: 1.5em; transform: rotate(-90deg); }
.chip circle { fill: none; stroke-width: 2.4; }
.chip .trk { stroke: rgba(255, 255, 255, 0.12); } .chip .val { stroke: var(--accent); }
.chip em { font-style: normal; font-weight: 600; color: var(--muted); font-size: 0.82em; }
.chip[data-state="active"] { border-color: #7dffb8; color: #7dffb8; } .chip[data-state="active"] .val { stroke: #7dffb8; }
.chip[data-state="cooldown"] .val { stroke: var(--muted); }
#cH[data-state="on"] { border-color: var(--gold); color: var(--gold); }
.hud-boss { position: absolute; left: 30%; right: 30%; top: 8%; }
.bname { display: flex; justify-content: space-between; font-weight: 700; font-size: 1.05em; text-shadow: 0 1px 2px #000; }
.bname em { font-style: normal; color: var(--gold); font-size: 0.8em; align-self: end; }
.bbar { position: relative; height: 0.55em; margin-top: 0.3em; background: rgba(255, 255, 255, 0.1); border: 1px solid #00000080; }
.bbar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #ff6a3d, #ffb36b); transition: width 0.15s; }
.bbar s { position: absolute; left: 0; bottom: -0.35em; height: 0.2em; background: #9fe3ff; }
.hud-obj { position: absolute; left: 50%; top: 8.4%; transform: translateX(-50%); padding: 0.25em 0.8em; background: rgba(6, 16, 20, 0.55); color: var(--muted); font-weight: 600; white-space: nowrap; border-radius: 2px; }
.hud-banner { position: absolute; left: 0; right: 0; top: 13%; text-align: center; text-shadow: 0 2px 6px #000; }
.hud-banner strong { display: block; font-size: 1.7em; letter-spacing: 0.12em; }
.hud-banner span { display: block; color: var(--accent); font-weight: 600; margin-top: 0.2em; }
.hud-banner.in { animation: bannerIn 0.5s ease-out; }
.hud-alert { position: absolute; left: 50%; top: 15%; transform: translateX(-50%); padding: 0.3em 0.9em; border: 1px solid var(--danger); background: rgba(60, 12, 8, 0.75); color: #ffd8cf; font-weight: 700; animation: blink 0.8s steps(2) infinite; }
.hud-pixel { position: absolute; left: 2.2%; bottom: 4%; max-width: 46%; display: flex; align-items: center; gap: 0.6em; padding: 0.45em 0.8em 0.45em 0.5em; background: var(--panel); border: 1px solid var(--line); border-radius: 3px; }
.hud-pixel p { margin: 0; font-weight: 600; line-height: 1.25; }
.hud-pixel[data-p="2"] { border-color: var(--danger); } .hud-pixel[data-p="2"] p { color: #ffd8cf; }
.hud-pixel[data-p="1"] { border-color: var(--accent); }
.hex { width: 1.7em; height: 1.5em; flex: none; background: #1d3a40; clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); display: flex; justify-content: center; align-items: center; gap: 0.25em; }
.hex i { width: 0.22em; height: 0.32em; background: var(--accent); }
.hud-pixel[data-mood="alert"] .hex i { background: var(--danger); height: 0.18em; }
.vignette { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(255, 40, 30, 0.55)); }
.assist .hud-tl { border-left-color: #7dffb8; }
@keyframes blink { 50% { opacity: 0.45; } }
@keyframes bannerIn { from { opacity: 0; transform: translateY(-6px); letter-spacing: 0.3em; } }

/* ---------- Dialogue ---------- */
#dialog { position: absolute; left: 50%; bottom: 3.5%; transform: translateX(-50%); width: min(78%, 46em); display: flex; gap: 0.9em; align-items: center;
  padding: 0.7em 1em; background: rgba(8, 10, 12, 0.88); border: 1px solid #4a4033; border-left: 3px solid #d9b77a; font-size: clamp(10px, 1.6cqw, 15px); z-index: 3; }
#dialog canvas { width: 3.6em; height: 3.6em; flex: none; image-rendering: pixelated; border: 1px solid #4a4033; }
#dialog b { display: block; color: #e8c88a; font-size: 0.82em; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 0.15em; }
#dialog p { margin: 0; line-height: 1.4; color: #efe6d6; min-height: 2.8em; }
#dialog[data-who="david"] { border-left-color: #7fb8e8; } #dialog[data-who="david"] b { color: #a9d2f2; }
#dialog[data-who="guard"] { border-left-color: var(--danger); } #dialog[data-who="guard"] b { color: #ff9a8a; }
#dialog[data-who="sistema"] { border-left-color: var(--accent); font-family: var(--display); } #dialog[data-who="sistema"] b { color: var(--accent); }
#dialog[data-who="narrador"] { background: transparent; border: 0; justify-content: center; text-align: center; } #dialog[data-who="narrador"] p { font-style: italic; color: #d8d0c0; min-height: 0; text-shadow: 0 1px 3px #000; }
#dialog[data-who="pixel"] { border-left-color: var(--accent); } #dialog[data-who="pixel"] b { color: var(--accent); }
#dialog[data-who="cazadora"] { border-left-color: #8a6aff; } #dialog[data-who="cazadora"] b { color: #c9b6ff; }
#dialog[data-who="corvo"] { border-left-color: #ff8a3d; } #dialog[data-who="corvo"] b { color: #ffb36b; }
#dialog[data-who^="egida"] { border-left-color: #7fe8d8; } #dialog[data-who^="egida"] b { color: #bff8ef; }
#stage.playing #dialog { top: 14%; bottom: auto; width: min(64%, 40em); }
#skip { position: absolute; right: 2%; top: 3%; z-index: 4; padding: 0.4em 0.8em; font-size: clamp(9px, 1.3cqw, 12px); background: rgba(8, 10, 12, 0.6); border: 1px solid #3a4448; color: #b8c8cc; border-radius: 3px; }
.keys .krow { display: flex; justify-content: space-between; align-items: center; gap: 1em; padding: 0.15em 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.keys .krow span { color: #c3d6d8; }
.keys .krow button { min-width: 7em; padding: 0.35em 0.7em; background: rgba(10, 24, 28, 0.85); border: 1px solid var(--line); border-radius: 2px; font-weight: 700; color: var(--accent); }
.keys .krow button.wait { border-color: var(--gold); color: var(--gold); animation: blink 0.6s steps(2) infinite; }
.title .chapter { max-width: 34em; line-height: 1.5; }

/* ---------- Menus ---------- */
.screen { position: absolute; inset: 0; display: grid; place-items: center; font-size: clamp(10px, 1.7cqw, 15px); padding: 4%; box-sizing: border-box; }
.screen.dim { background: rgba(3, 7, 9, 0.72); backdrop-filter: blur(2px); }
.screen.is-title { place-items: center start; background: linear-gradient(90deg, rgba(3, 7, 9, 0.88), rgba(3, 7, 9, 0.2) 70%); }
.kicker { margin: 0; font-size: 0.8em; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); }
.kicker.alert { color: var(--danger); }
.title h1 { margin: 0.1em 0 0; font-size: 5.6em; line-height: 0.95; letter-spacing: 0.08em; font-weight: 700; color: #eef7f6; text-shadow: 0 0 24px rgba(127, 232, 216, 0.25); }
.chapter { margin: 0.2em 0 1.4em; color: var(--muted); font-size: 1.1em; }
.chapter em { color: var(--text); font-style: normal; }
.menu { display: grid; gap: 0.5em; min-width: 18em; }
.menu.row { display: flex; flex-wrap: wrap; min-width: 0; margin-top: 1em; }
.menu button { display: flex; justify-content: space-between; gap: 1.5em; align-items: center; text-align: left; padding: 0.7em 1em; background: rgba(10, 24, 28, 0.85);
  border: 1px solid var(--line); border-left: 3px solid var(--line); border-radius: 2px; font-weight: 600; letter-spacing: 0.04em; }
.menu button:hover { border-color: var(--accent); background: rgba(16, 40, 44, 0.9); }
.menu button.primary { background: var(--accent); color: #062024; border-color: var(--accent); font-weight: 700; }
.menu button.primary:hover { background: #a8fff0; }
.menu button span { font-size: 0.75em; opacity: 0.7; font-weight: 600; }
.menu button.ghost { background: transparent; color: var(--muted); }
.card { max-width: 34em; width: 100%; padding: 1.6em 1.8em; background: rgba(6, 16, 20, 0.92); border: 1px solid var(--line); border-top: 2px solid var(--accent); box-sizing: border-box; }
.card.wide { max-width: 44em; }
.card h2 { margin: 0.2em 0 0.4em; font-size: 2em; letter-spacing: 0.04em; text-wrap: balance; }
.card p { line-height: 1.55; color: #c3d6d8; max-width: 60ch; }
.card .next { color: var(--gold); font-weight: 600; }
.card .hint { color: var(--muted); font-size: 0.85em; }
.keys, .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.35em 1.4em; margin: 0.6em 0; }
.stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.keys div, .stats div { display: flex; gap: 0.8em; align-items: baseline; }
.stats div { flex-direction: column; gap: 0.1em; }
.keys dt { min-width: 5.5em; font-weight: 700; color: var(--accent); }
.keys dd, .stats dd { margin: 0; color: #c3d6d8; }
.stats dt { font-size: 0.75em; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.stats dd { font-size: 1.6em; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); }

/* ---------- Touch: fixed to the screen edges, mostly outside the 16:9 stage ---------- */
#touch { position: fixed; inset: 0; pointer-events: none; display: none; font-size: 13px; z-index: 5; }
body.playing #touch:not([hidden]) { display: block; }
#touch button { pointer-events: auto; background: rgba(10, 24, 28, 0.45); border: 1px solid rgba(127, 232, 216, 0.3); border-radius: 8px; color: var(--text); font-weight: 700; touch-action: none; }
#touch button.on { background: rgba(127, 232, 216, 0.4); }
.tpad { position: absolute; left: max(6px, env(safe-area-inset-left, 0px)); bottom: max(10px, env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(2, 44px); gap: 6px; }
.tbtns { position: absolute; right: max(6px, env(safe-area-inset-right, 0px)); bottom: max(10px, env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(2, 48px); gap: 6px; }
.tbtns button, .tpad button { height: 40px; }
.tpause { position: absolute; right: max(6px, env(safe-area-inset-right, 0px)); top: max(8px, env(safe-area-inset-top, 0px)); width: 40px; height: 40px; }
#rotate { display: none; }
@media (orientation: portrait) and (pointer: coarse) { #rotate { display: grid; place-items: center; position: fixed; inset: 0; background: var(--bg); color: var(--accent); font-weight: 700; text-align: center; padding: 24px; z-index: 9; } }
@container (max-width: 640px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .keys { grid-template-columns: 1fr; } .title h1 { font-size: 4em; } }
@media (prefers-reduced-motion: reduce) { .hud-banner.in, .hud-alert, .low-hp .bar.hp i { animation: none; } }

#fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
/* PIXEL boss card: right edge, compact */
.hud-scan { position: absolute; right: 1.6%; top: 22%; width: min(23%, 15em); padding: 0.55em 0.7em 0.6em; background: rgba(6, 14, 16, 0.86); border: 1px solid var(--accent); border-left-width: 3px; border-radius: 3px; font-size: 0.86em; line-height: 1.3; animation: scanIn 0.45s ease-out; transition: opacity 0.6s, transform 0.6s; }
.hud-scan.out { opacity: 0; transform: translateX(12px); }
.hud-scan header { display: flex; flex-direction: column; margin-bottom: 0.3em; }
.hud-scan header span { font-size: 0.78em; letter-spacing: 0.12em; color: var(--accent); }
.hud-scan header b { font-size: 1.15em; letter-spacing: 0.06em; color: #e9fbff; }
.hud-scan p { margin: 0 0 0.35em; color: #b8c8cc; }
.hud-scan h4 { margin: 0.35em 0 0.1em; font-size: 0.78em; letter-spacing: 0.1em; text-transform: uppercase; }
.hud-scan h4.weak { color: #7fe8a0; } .hud-scan h4.strong { color: #ff9a7a; } .hud-scan h4.tip { color: #ffd59a; }
.hud-scan ul { margin: 0; padding-left: 1em; color: #e3eef0; }
.hud-scan li { margin: 0.05em 0; }
@keyframes scanIn { from { opacity: 0; transform: translateX(16px); clip-path: inset(0 0 100% 0); } to { opacity: 1; transform: none; clip-path: inset(0 0 0 0); } }
/* chapter select */
.chap { display: flex; align-items: center; justify-content: space-between; gap: 1em; padding: 0.6em 0.8em; margin: 0.35em 0; background: rgba(255,255,255,0.03); border: 1px solid #22303a; border-radius: 3px; }
.chap div { display: flex; flex-direction: column; gap: 0.15em; }
.chap b { color: #e9fbff; } .chap span { font-size: 0.85em; color: #8fa3a6; }
.chap em { font-style: normal; font-size: 0.85em; color: #ffd59a; letter-spacing: 0.06em; }
.chap.locked { opacity: 0.55; } .chap.locked em { color: #6a7a7e; }

/* key caps in dialog */
#dialog kbd { display: inline-block; min-width: 1.5em; padding: 0.05em 0.45em; margin: 0 0.1em; border: 1px solid currentColor; border-bottom-width: 2px; border-radius: 4px; font: 700 0.92em var(--display, inherit); text-align: center; background: rgba(255,255,255,0.06); }
#dialog[data-who="pixel"] kbd { color: #05130f; background: #7fe8d8; border-color: #bff8ef; }
@keyframes holoIn { 0% { transform: translateX(-50%) scaleY(0.04); filter: brightness(3); opacity: 0; } 60% { opacity: 1; } 100% { transform: translateX(-50%) scaleY(1); filter: none; } }
@keyframes holoFlicker { 0%, 100% { opacity: 1; } 47% { opacity: 1; } 48% { opacity: 0.72; } 49% { opacity: 1; } 83% { opacity: 0.86; } 84% { opacity: 1; } }
@keyframes holoSweep { to { top: 130%; } }

.menu.diffs { display: flex; flex-direction: column; gap: 0.4em; }
.menu.diffs .diff { display: flex; flex-direction: column; align-items: flex-start; gap: 0.15em; text-align: left; }
.menu.diffs .diff span { font-size: 0.82em; opacity: 0.8; white-space: normal; }
</style>
<div id="stage">
  <canvas id="game" width="480" height="270" aria-label="Juego ÉGIDA"></canvas>
  <canvas id="txt" aria-hidden="true"></canvas>
  <div id="hud" aria-hidden="true"></div>
  <div id="fade" aria-hidden="true"></div>
  <div id="dialog" hidden></div>
  <button id="skip" hidden>Saltar escena · Esc</button>
  <div id="screen" class="screen" hidden></div>
</div>
